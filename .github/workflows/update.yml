name: update-news
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --no-package-lock jsdom@24 @mozilla/readability@0.5.0
      - run: node build.mjs
      - run: |
          touch .nojekyll
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data .nojekyll
          git commit -q -m "تحديث الأخبار" || exit 0
          git pull -q --rebase || true
          git push -q

