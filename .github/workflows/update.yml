name: update-news
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --no-package-lock jsdom@24 @mozilla/readability@0.5.0
      - name: Update news continuously (every ~2.5 min for ~48 min)
        run: |
          git config --global user.name "news-bot"
          git config --global user.email "news-bot@users.noreply.github.com"
          git fetch -q --depth=1 origin data
          git worktree add -q out FETCH_HEAD
          end=$((SECONDS+48*60)); i=0
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS; i=$((i+1))
            (cd out && node ../build.mjs) || echo "build failed"
            (cd out && git checkout -q --orphan "r$i" && git add -A data && git commit -q -m "update $i" && git push -q -f origin HEAD:data) || echo "push failed"
            el=$((SECONDS-start)); if [ $el -lt 150 ]; then sleep $((150-el)); fi
          done
      - name: Start next round
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main -R ${{ github.repository }} || true
