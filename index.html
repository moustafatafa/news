<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="News">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f2f3f6;--card:#fff;--ink:#0d1526;--ink2:#3f4a5e;--mute:#8691a4;--line:#e6e8ee;--soft:#f6f7f9;--brand:#0f2a4a;--acc:#d61f3a;--fb:#15803d;
 --sh:0 1px 2px rgba(13,21,38,.04),0 4px 14px -6px rgba(13,21,38,.12);--r:16px;--fs:18px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
 --font:-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif}
html.dark{--bg:#0b0f17;--card:#151b26;--ink:#eef2f7;--ink2:#bcc4d1;--mute:#7c8698;--line:#252d3a;--soft:#1b2230;--brand:#9cc3ff;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px -8px rgba(0,0,0,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}
img{display:block}
.wrap{max-width:720px;margin:0 auto;padding:0 12px}
#view{padding-bottom:calc(96px + var(--sb));min-height:100vh}

/* header */
header{position:relative;z-index:30;background:var(--card);padding-top:var(--st);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:6px;height:58px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand img{width:36px;height:36px;border-radius:10px;flex:none}
.wm{display:flex;flex-direction:column;min-width:0;line-height:1.1}
.wm b{font:800 24px/1 "New York",ui-serif,Georgia,"Times New Roman",serif;letter-spacing:-.3px;direction:ltr;text-align:right}
.wm small{font-size:11.5px;color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--soft);flex:none;color:var(--ink2)}
.ib svg{width:18px;height:18px}
.ib.spin svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(-360deg)}}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#16a34a;margin-left:4px;vertical-align:1px}
.bar{height:2px;background:linear-gradient(90deg,var(--acc),#ff8a3d);width:0;transition:width .4s}

/* date/clock + category tabs */
.dt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 10px}
.dt b{font-size:16.5px;font-weight:800;color:var(--ink)}
.dt small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
.clk{font:800 19px/1 var(--font);direction:ltr;font-variant-numeric:tabular-nums;color:var(--brand);background:var(--soft);padding:8px 11px;border-radius:12px;white-space:nowrap}
.ctabs{position:sticky;top:0;z-index:29;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 4px 12px -10px rgba(0,0,0,.3)}
.ctabs .in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:720px;margin:0 auto;padding:6px 10px}
.ctabs .in::-webkit-scrollbar{display:none}
.ctabs button{flex:none;padding:8px 14px;border-radius:999px;font-weight:800;font-size:14.5px;color:var(--ink2)}
.ctabs button.on{background:var(--c,var(--acc));color:#fff}
/* hero carousel */
.hero{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r);margin-top:12px;box-shadow:var(--sh);background:#111}
.hero::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative;aspect-ratio:4/3.3;color:#fff;cursor:pointer}
.slide .ph{position:absolute;inset:0;background:#222}
.slide:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.88))}
.slide .ct{position:absolute;inset:auto 0 0 0;padding:16px 16px 18px;z-index:1}
.slide h3{font-size:20px;line-height:1.5;font-weight:800;margin:8px 0 0}
.slide .meta,.slide .meta b{color:rgba(255,255,255,.9)}
.slide .badge{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:7px;background:var(--c);color:#fff}
.dots{display:flex;justify-content:center;gap:5px;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:6px;background:var(--line);transition:all .3s}
.dots i.on{width:18px;background:var(--acc)}
/* section carousels */
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:6px 14px 14px;scroll-padding:0 14px}
.car::-webkit-scrollbar{display:none}
.cc2{flex:0 0 76%;max-width:300px;scroll-snap-align:start;cursor:pointer;min-width:0}
.cc2 .ph{aspect-ratio:16/10;border-radius:12px}
.cc2 h3{font-size:15px;line-height:1.6;margin:8px 0 5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sec2 .bh h2 small{font-size:12px;color:var(--mute);font-weight:600}
/* tabs/chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 12px 2px;margin:0 -12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:12px 0 0}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:700;font-size:14.5px;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--card)}
.ttl{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 0}
.ttl h1{font-size:24px;font-weight:800}
.ttl small{color:var(--mute);font-size:12.5px}

/* boxes */
.box{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-top:14px;overflow:hidden}
.bh{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 4px}
.bh h2{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.bh h2:before{content:"";width:4px;height:18px;border-radius:3px;background:var(--c,var(--acc))}
.bh button{font-size:13px;font-weight:700;color:var(--c,var(--acc))}

/* media */
.ph{background:var(--soft);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);min-width:0;white-space:nowrap}
.meta b{color:var(--ink2);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.sl{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;color:#fff;font-weight:800;font-style:normal;flex:none;background:var(--c)}

/* lead */
.lead{display:block;padding:10px 14px 14px;cursor:pointer}
.lead .ph{aspect-ratio:16/9;border-radius:12px}
.lead h3{font-size:19px;line-height:1.55;margin:10px 0 6px;font-weight:800}
.lead p{margin:0 0 8px;color:var(--ink2);font-size:13.5px;line-height:1.75;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* row */
.row{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start}
.row .ph{width:104px;height:78px;border-radius:10px;flex:none}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.row h3{font-size:15px;line-height:1.6;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.box>.row:first-of-type{border-top:0}
.lead+.row{border-top:1px solid var(--line)}
/* 2-col tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px 14px}
.tile{cursor:pointer;min-width:0}
.tile .ph{aspect-ratio:4/3;border-radius:10px}
.tile h3{font-size:14px;line-height:1.6;margin:7px 0 5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.morebtn{display:block;width:100%;padding:13px;border-top:1px solid var(--line);font-weight:700;font-size:14px;color:var(--c,var(--acc))}
.row:active,.lead:active,.tile:active{background:var(--soft)}
.sentinel{height:1px}
.empty{text-align:center;padding:46px 20px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.sk{background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.pill{position:fixed;top:calc(64px + var(--st));left:50%;transform:translate(-50%,-140px);opacity:0;pointer-events:none;z-index:40;background:var(--acc);color:#fff;font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:999px;box-shadow:0 8px 20px -6px rgba(214,31,58,.6);transition:transform .3s}
.pill.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}

/* matches */
.days{display:flex;gap:8px;margin-top:12px}
.days button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.days b{font-size:14px}.days small{font-size:11.5px;color:var(--mute)}
.days button.on{background:var(--fb);border-color:var(--fb);color:#fff}.days button.on small{color:rgba(255,255,255,.85)}
.lg{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-top:12px;overflow:hidden}
.lgh{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--soft);font-weight:800;font-size:15px;width:100%;text-align:right}
.lgh span{flex:1}.lgh small{color:var(--mute);font-weight:600;font-size:12px}
.mt{padding:12px 10px 10px;border-top:1px solid var(--line)}
.lgh+.mt{border-top:0}
.mr{display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;gap:6px}
.tm{display:flex;align-items:center;gap:7px;min-width:0;font-weight:700;font-size:13.5px;line-height:1.45}
.tm.b{flex-direction:row-reverse}
.tm span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tm.b span{text-align:left}
.lo{width:30px;height:30px;border-radius:50%;flex:none;background:var(--soft);object-fit:contain;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--mute)}
.mid{text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.sc{display:flex;gap:7px;font:800 21px/1 var(--font);direction:rtl}
.tmn{font-weight:800;font-size:15.5px;direction:ltr;white-space:nowrap}
.st{white-space:nowrap;font-size:11px;font-weight:700;color:var(--mute);background:var(--soft);padding:2px 8px;border-radius:6px}
.st.live{background:#fee2e2;color:#dc2626}.st.live:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#dc2626;margin-left:4px;animation:pl 1s infinite}
html.dark .st.live{background:#3b1418}
@keyframes pl{50%{opacity:.2}}
.mx{text-align:center;font-size:11.5px;color:var(--mute);margin-top:7px}
.note{font-size:12px;color:var(--mute);text-align:center;margin:12px 0}

/* countries */
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.cc{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cc .f{font-size:28px;line-height:1}.cc b{font-size:13px}.cc small{font-size:11px;color:var(--mute)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sgc{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:13px;box-shadow:var(--sh);padding:10px;text-align:right}
.sgc .sl{width:30px;height:30px;border-radius:9px;font-size:14px}
.sgc b{font-size:13.5px;display:block}.sgc small{font-size:11px;color:var(--mute)}
.sgc.off{opacity:.45}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:5px 6px calc(5px + var(--sb))}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mute);padding:5px 0}
nav svg{width:24px;height:24px}
nav button.on{color:var(--acc)}

/* reader */
.sheet{position:fixed;inset:0;z-index:50;background:var(--card);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.rbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:calc(8px + var(--st)) 12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
.rbar .sp{flex:1}
.fsz{display:flex;gap:4px}
.rimg{margin:0 -12px;aspect-ratio:16/10;max-height:56vh}
.rmeta{display:flex;align-items:center;gap:9px;margin-top:14px}
.rmeta .sl{width:32px;height:32px;border-radius:9px;font-size:14px}
.rmeta small{display:block;color:var(--mute);font-size:11.5px}.rmeta b{font-size:14.5px}
.rh{font-size:calc(var(--fs) + 7px);line-height:1.5;margin:12px 0 14px;font-weight:800}
.body{font-size:var(--fs);line-height:2;color:var(--ink2)}
.body p{margin:0 0 15px}
.body img{width:calc(100% + 24px);max-width:none;margin:6px -12px 14px;height:auto}
.body h3{font-size:calc(var(--fs) + 1px);color:var(--ink);margin:18px 0 8px;line-height:1.6}
.body blockquote{margin:14px 0;padding:4px 12px;border-right:4px solid var(--acc);color:var(--ink)}
.body small{display:block;font-size:12.5px;color:var(--mute);margin:-8px 0 12px}
.loading{display:flex;align-items:center;gap:9px;color:var(--mute);font-size:14px;padding:12px 0}
.spn{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite}
.endnote{font-size:12.5px;color:var(--mute);border-top:1px dashed var(--line);padding-top:12px;margin-top:6px}
.sbox{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:0 13px;margin-top:12px}
.sbox input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:13px 0;outline:none}
.toast{position:fixed;bottom:calc(84px + var(--sb));left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--card);padding:9px 15px;border-radius:12px;font-size:13.5px;font-weight:700;opacity:0;transition:all .25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
 <div class="wrap hd">
  <div class="brand"><img src="icon-192.png" alt=""><div class="wm"><b>News</b></div></div>
  <button class="ib" id="bSearch" aria-label="بحث"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <button class="ib" id="bSaved" aria-label="المحفوظات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
  <button class="ib" id="bRefresh" aria-label="تحديث"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3.9L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14.9 3.9L20 15"/><path d="M20 20v-5h-5"/></svg></button>
  <button class="ib" id="bTheme" aria-label="الوضع الليلي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
 </div>
 <div class="wrap dt"><div><b id="date"></b><small id="sub"></small></div><span class="clk" id="clock"></span></div>
 <div class="bar" id="bar"></div>
</header>
<div class="ctabs"><div class="in" id="ctabs"></div></div>
<main class="wrap" id="view"></main>
<nav><div class="in" id="nav"></div></nav>
<section class="sheet" id="reader"></section>
<button class="pill" id="pill">↑ أخبار جديدة</button>
<div class="toast" id="toast"></div>
<script>
/* ============ CONFIG ============ */
const SRCS_DEFAULT={yallakora:["يلا كورة","#16a34a"],filgoal:["في الجول","#0f766e"],youm7:["اليوم السابع","#c8102e"],shorouk:["الشروق","#0b6e4f"],masryalyoum:["المصري اليوم","#1d4ed8"],masrawy:["مصراوي","#ef4444"],elwatan:["الوطن","#b91c1c"],akhbarelyom:["أخبار اليوم","#9a3412"],ahram:["بوابة الأهرام","#1e3a8a"],dostor:["الدستور","#7c3aed"],ahramsport:["الأهرام الرياضي","#0369a1"],amwal:["أموال الغد","#0d9488"],bbc:["بي بي سي عربي","#b80000"],skynews:["سكاي نيوز عربية","#0b4ea2"],aljazeera:["الجزيرة","#c48a12"],alarabiya:["العربية","#0f766e"],france24:["فرانس 24","#0ea5e9"],cnn:["سي إن إن عربية","#dc2626"],rt:["آر تي عربي","#15803d"],dw:["دويتشه فيله","#0c4a6e"],aawsat:["الشرق الأوسط","#065f46"],okaz:["عكاظ","#1f2937"],almal:["جريدة المال","#b45309"],alborsa:["البورصة","#0e7490"],euronews:["يورونيوز","#1e40af"],independent:["اندبندنت عربية","#be123c"],anadolu:["الأناضول","#1d4ed8"]};
const CATS={pol:["سياسة","#d61f3a"],eco:["اقتصاد ومال","#0d9488"],fb:["كورة","#15803d"],tr:["نقل","#2563eb"],tech:["تكنولوجيا","#7c3aed"],art:["فن ومنوعات","#db2777"]};

function parseRSS(xml,sid,s,fcat){
  const doc=new DOMParser().parseFromString(xml.replace(/^﻿/,""),"text/xml"); const T=(e,n)=>{const x=e.getElementsByTagName(n)[0];return x?x.textContent.trim():""};
  const tx=h=>{const d=document.createElement("div");d.innerHTML=String(h||"").replace(/<(script|img|iframe)[^>]*>/gi,"");return d.textContent.replace(/\s+/g," ").trim()};
  return [...doc.getElementsByTagName("item")].slice(0,25).map(it=>{
    const l=T(it,"link"),t=tx(T(it,"title")); if(!l||!t) return null;
    let img=null; for(const tg of ["media:content","media:thumbnail","enclosure"]){const n=it.getElementsByTagName(tg)[0];if(n&&n.getAttribute("url")){img=n.getAttribute("url");break}}

/* source sub-tabs ordered by priority */
function srcTabs(pool,key,pri,withAll=true,allFirst=true){

  if(F.src[key]==null) F.src[key]=allFirst||!ids.length?"all":ids[0];
  if(F.src[key]!=="all"&&!cnt[F.src[key]]) F.src[key]=allFirst||!ids.length?"all":ids[0];
  const allB=`<button class="chip ${F.src[key]==="all"?"on":""}" data-stab="${key}" data-v="all">كل المصادر <small style="opacity:.6">${num(pool.length)}</small></button>`;

  const sel=F.src[key]==="all"?pool:pool.filter(a=>a.src===F.src[key]);
  return {html:`<div class="chips">${withAll&&allFirst?allB:""}${b}${withAll&&!allFirst?allB:""}</div>`,sel};
}

function vMatches(){
  const days=[-1,0,1,2].map(o=>cairoKey(o));
  let h=`<div class="days">${days.map((d,i)=>`<button data-day="${i-1}" class="${F.day===i-1?"on":""}"><b>${DAYN[i]}</b><small>${d.d.toLocaleDateString("ar-EG",{day:"numeric",month:"short",timeZone:"Africa/Cairo"})}</small></button>`).join("")}</div>`;
  h+=chips("mf",[["all","كل البطولات"],["live","🔴 مباشر"],["eg","🇪🇬 مصر"],["eu","🇪🇺 أوروبا"],["ar","العربية"]]);
  let L=(MT.days[cairoKey(F.day).key]||[]).map(l=>({...l}));
  if(F.mf==="live") L=L.map(l=>({...l,m:l.m.filter(isLive)}));
  if(F.mf==="eg") L=L.filter(l=>/مصر|المصري|أفريقيا/.test(l.n));
  if(F.mf==="eu") L=L.filter(l=>/أوروب|الإنجليزي|الإسباني|الإيطالي|الألماني|الفرنسي|البرتغالي|الهولندي|التركي/.test(l.n));
  if(F.mf==="ar") L=L.filter(l=>/السعودي|الإماراتي|القطري|قطر|المغربي|التونسي|الجزائري|الكويتي|العربي|الخليج/.test(l.n));
  L=L.filter(l=>l.m.length).sort((a,b)=>lpri(a.n)-lpri(b.n));
  if(!L.length) h+=`<div class="empty"><b>${MT.updated?"مفيش مباريات":"جاري تحميل المباريات…"}</b>${MT.updated?"جرّب يوم تاني أو بطولة تانية":""}</div>`;
  h+=L.map(l=>`<section class="lg"><div class="lgh">🏆<span>${esc(l.n)}</span><small>${num(l.m.length)} مباراة</small></div>${l.m.map(matchRow).join("")}</section>`).join("");
  h+=`<div class="note">المواعيد بتوقيت القاهرة · المصدر: يلا كورة${MT.updated?` · تحديث ${ago(MT.updated)}`:""}</div>`;
  return h;
}
let mLoading=false;
async function loadMatches(live){
  if(mLoading) return; mLoading=true;
  try{const r=await tfetch("data/matches.json?t="+Date.now(),12000,{cache:"no-store"});if(r.ok){const j=await r.json();if(j.updated>MT.updated){MT=j;S.set("mt",MT)}}}catch(e){}
  if(live){ // live scores straight from Yallakora for the selected day
    try{const d=cairoKey(F.day);const html=await viaProxy(`https://www.yallakora.com/match-center/?date=${d.yk}`,10000);const L=parseMatches(new DOMParser().parseFromString(html.replace(/<script[\s\S]*?<\/script>/gi,""),"text/html"));if(L.length){MT={...MT,updated:Date.now(),days:{...MT.days,[d.key]:L}};S.set("mt",MT)}}catch(e){}
  }
  mLoading=false;
  if(route.v==="fb"&&F.fbSeg==="matches"&&!openId){const y=scrollY;render();scrollTo(0,y)}
  else if(route.v==="home"&&scrollY<100&&!openId) render();
}
function parseMatches(doc){
  const clean=s=>String(s||"").replace(/\s+/g," ").trim();
  const dedup=s=>{s=clean(s);const w=s.split(" ");const h=w.length/2;return w.length%2===0&&w.slice(0,h).join(" ")===w.slice(h).join(" ")?w.slice(0,h).join(" "):s};
  const img=el=>{if(!el)return null;const u=el.getAttribute("data-src")||el.getAttribute("src");try{return u&&!/^data:/.test(u)?new URL(u,"https://www.yallakora.com/").href:null}catch(e){return null}};
  const out=[];let cur=null;const seen=new Set();
  for(const el of doc.querySelectorAll("h2, a[href*='/match/']")){
    if(el.tagName==="H2"){cur={n:clean(el.textContent),m:[]};out.push(cur);continue}
    if(!cur)continue; const q=s=>el.querySelector(s);
    const id=(el.getAttribute("href").match(/match\/(\d+)/)||[])[1]; if(id&&seen.has(id))continue;
    let a=q(".teamA p")?.textContent,b=q(".teamB p")?.textContent;const sc=[...el.querySelectorAll(".MResult .score")].map(x=>clean(x.textContent));
    let t=clean(q(".MResult .time")?.textContent),st=clean(q(".matchStatus")?.textContent),ch=clean(q(".channel")?.textContent),rd=clean(q(".date")?.textContent),sa=sc[0]||"-",sb=sc[2]||sc[1]||"-";
    if(!a||!b){const m=clean(el.textContent).match(/(لم تبدأ|انتهت|جارية|مؤجلة|ألغيت|الشوط الأول|الشوط الثاني|استراحة|\d{1,3}')\s+(.+?)\s+(\d+|-)\s+-\s+(\d+|-)\s+(\d{1,2}:\d{2})\s+(.+)$/);if(!m)continue;st=st||m[1];a=m[2];sa=m[3];sb=m[4];t=t||m[5];b=m[6]}
    a=dedup(a);b=dedup(b);if(!a||!b)continue;if(id)seen.add(id);
    cur.m.push({a,b,al:img(q(".teamA img")),bl:img(q(".teamB img")),sa:/\d/.test(sa)?sa:"-",sb:/\d/.test(sb)?sb:"-",t,st,ch,rd,id});
  }
  return out.filter(l=>l.m.length);
}
/* ---- countries / sources / search / saved ---- */
function vCountries(){const A=ok(all());return ttl("حسب الدولة")+`<div class="cg">${COUNTRIES.map(([k,n,f])=>{const c=A.filter(a=>(a.cs||[]).includes(k)).length;return `<button class="cc" data-country="${k}"><span class="f">${f}</span><b>${n}</b><small>${c?num(c)+" خبر":"لا جديد"}</small></button>`}).join("")}</div>`+ttl("المصادر")+`<div class="sg">${Object.keys(SR).map(id=>{const[n,c]=src(id);const k=A.filter(a=>a.src===id).length;return `<button class="sgc ${k?"":"off"}" data-srcv="${id}" style="--c:${c}"><i class="sl">${esc(ini(n))}</i><div><b>${esc(n)}</b><small>${k?num(k)+" خبر":"غير متاح الآن"}</small></div></button>`}).join("")}</div>`}
function vCountry(){const c=COUNTRIES.find(x=>x[0]===route.c);const p=ok(byTime(all().filter(a=>(a.cs||[]).includes(c[0]))));const news=p.filter(a=>a.cat!=="fb"),fb=p.filter(a=>a.cat==="fb");if(F.cseg==="fb"&&!fb.length)F.cseg="news";const l=F.cseg==="fb"?fb:news;const t=srcTabs(l,"c_"+c[0]+F.cseg,PRI.world);return `<div class="chips"><button class="chip" data-nav="countries">› كل الدول</button></div>`+ttl(`${c[2]} ${c[1]}`,`${num(p.length)} خبر`)+`<div class="seg"><button data-cseg="news" class="${F.cseg!=="fb"?"on":""}">الأخبار (${num(news.length)})</button><button data-cseg="fb" class="${F.cseg==="fb"?"on":""}">الكورة (${num(fb.length)})</button></div>`+t.html+`<section class="box">${list(t.sel,{})}</section>`}
function vSource(){const[n]=src(route.s);return `<div class="chips"><button class="chip" data-nav="countries">› كل المصادر</button></div>`+ttl(esc(n))+`<section class="box">${list(byTime(all().filter(a=>a.src===route.s)))}</section>`}
const norm=s=>String(s||"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");
function vSearch(){return `<div class="sbox"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--mute)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="ابحث… الأهلي، الدولار، المترو" value="${esc(route.q||"")}" autocomplete="off"></div><div id="sres"></div>`}
function searchRes(){const q=norm((route.q||"").trim());if(!q)return `<div class="empty"><b>ابحث في كل الأخبار</b></div>`;return `<section class="box">${list(byTime(all().filter(a=>norm(a.t+" "+a.d).includes(q))))}</section>`}
function vSaved(){return ttl("المحفوظات",num(saved.length))+(saved.length?`<section class="box">${saved.map(row).join("")}</section>`:`<div class="empty"><b>مفيش محفوظات لسه</b>اضغط علامة الحفظ داخل أي خبر</div>`)}

const NAV=[["home","الرئيسية",'<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],["eg","مصر",'<path d="M5 21V4m0 0h11l-2 4 2 4H5"/>'],["world","العالم",'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>'],["fb","الكورة",'<circle cx="12" cy="12" r="9"/><path d="m12 7 4 3-1.5 4.5h-5L8 10z"/>'],["countries","الدول",'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>']];
function renderNav(){const cur={country:"countries",source:"countries"}[route.v]||route.v;$("#nav").innerHTML=NAV.map(([k,n,p])=>`<button data-nav="${k}" class="${cur===k?"on":""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>${n}</button>`).join("")}
function render(){
  pending=null;$("#pill").classList.remove("on");
  for(const k in LISTS) delete LISTS[k];
  const f={home:vHome,cat:vCat,eg:vEg,world:vWorld,fb:vFb,countries:vCountries,country:vCountry,source:vSource,search:vSearch,saved:vSaved}[route.v]||vHome;
  $("#view").innerHTML=f(); renderNav(); renderTabs(); observe(); initHero();
  if(route.v==="search"){$("#sres").innerHTML=searchRes();observe();const q=$("#q");q.oninput=()=>{route.q=q.value;$("#sres").innerHTML=searchRes();observe()};if(!route.q)setTimeout(()=>q.focus(),50)}
}
function renderTabs(){const cur=route.v==="cat"?route.c:route.v;const el=$("#ctabs");el.innerHTML=CTABS.map(([k,n,c])=>`<button data-ctab="${k}" class="${cur===k?"on":""}" style="--c:${c}">${n}</button>`).join("");const on=el.querySelector(".on");if(on)on.scrollIntoView({inline:"center",block:"nearest"})}
let heroT=null;
function initHero(){clearInterval(heroT);const h=$("#hero");if(!h)return;const n=h.children.length;let touching=false;
  const idx=()=>Math.round(Math.abs(h.scrollLeft)/h.clientWidth);
  h.addEventListener("scroll",()=>{const i=idx();document.querySelectorAll("#dots i").forEach((d,j)=>d.classList.toggle("on",i===j))},{passive:true});
  h.addEventListener("touchstart",()=>touching=true,{passive:true});h.addEventListener("touchend",()=>setTimeout(()=>touching=false,4000),{passive:true});
  heroT=setInterval(()=>{if(touching||openId||document.hidden||!document.body.contains(h))return;const r=h.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;const i=idx();const rtl=getComputedStyle(h).direction==="rtl";const next=i+1>=n?0:i+1;h.scrollTo({left:(rtl?-1:1)*next*h.clientWidth,behavior:"smooth"})},5000)}
let mTimer=null;
function go(v,extra={}){route={v,...extra};render();scrollTo(0,0);clearInterval(mTimer);if(v==="fb"&&F.fbSeg==="matches")startMatches()}
function startMatches(){loadMatches(true);clearInterval(mTimer);mTimer=setInterval(()=>{if(route.v==="fb"&&F.fbSeg==="matches"&&document.visibilityState==="visible")loadMatches(true)},60000)}
function setSub(){$("#sub").innerHTML=DB.updated?`<span class="live-dot"></span>آخر تحديث ${ago(DB.updated)} · ${num(DB.items.length)} خبر`:"جاري التحميل…"}
function tick(){const d=new Date();const p=Object.fromEntries(new Intl.DateTimeFormat("ar-EG",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).formatToParts(d).map(x=>[x.type,x.value]));$("#date").textContent=`${p.weekday} ${p.day} ${p.month} ${p.year}`;$("#clock").textContent=d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true})}
function bar(p){$("#bar").style.width=(p*100)+"%"}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2000)}

/* ============ READER ============ */
const findA=id=>DB.items.find(a=>a.id===id)||saved.find(a=>a.id===id);
let RD=null;
function loadReadability(){return RD||(RD=new Promise(r=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@mozilla/readability@0.5.0/Readability.js";s.onload=()=>r(1);s.onerror=()=>r(0);document.head.appendChild(s)}))}
function clientClean(html,base){
  const d=document.createElement("div");d.innerHTML=html;const out=[];
  d.querySelectorAll("p,h2,h3,blockquote,img,li").forEach(n=>{if(n.tagName==="IMG"){const u=n.getAttribute("data-src")||n.getAttribute("src");try{const x=new URL(u,base).href;if(/^https?:/.test(x)&&!/logo|icon|\.gif|\.svg/i.test(x))out.push(`<img src="${esc(x)}">`)}catch(e){}return}if(n.closest("li")&&n.tagName!=="LI")return;const t=n.textContent.replace(/\s+/g," ").trim();if(t.length>30)out.push(`<${n.tagName==="BLOCKQUOTE"?"blockquote":/H/.test(n.tagName)?"h3":"p"}>${esc(t)}</${n.tagName==="BLOCKQUOTE"?"blockquote":/H/.test(n.tagName)?"h3":"p"}>`)});
  return out.join("");
}
async function getBody(a){
  if(a.b){try{const r=await tfetch(`data/a/${a.id}.json`,12000);if(r.ok){const j=await r.json();if(j.h)return j.h}}catch(e){}}
  try{const html=await viaProxy(a.l,14000);const doc=new DOMParser().parseFromString(html.replace(/<script[\s\S]*?<\/script>/gi,""),"text/html");const b=doc.createElement("base");b.href=a.l;doc.head&&doc.head.appendChild(b);
    if(await loadReadability()&&window.Readability){const r=new Readability(doc,{charThreshold:250}).parse();if(r&&r.content){const h=clientClean(r.content,a.l);if(h.length>300)return h}}
    const root=doc.querySelector("[itemprop=articleBody],.article-body,.articleBody,#articleBody,.entry-content,article")||doc.body;const h=clientClean(root.innerHTML,a.l);if(h.length>300)return h;
  }catch(e){}
  return null;
}
async function openReader(id,noPush){
  const a=findA(id);if(!a)return;openId=id;
  const[sn,sc]=src(a.src),isS=saved.some(x=>x.id===id);
  const rel=ok(byTime(DB.items.filter(x=>x.id!==id&&x.cat===a.cat&&!!x.loc===!!a.loc))).slice(0,4);
  $("#reader").innerHTML=`<div class="rbar"><button class="ib" id="rClose" aria-label="رجوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button><div class="sp"></div><div class="fsz"><button class="ib" id="fsm" style="font-weight:800;font-size:13px">A-</button><button class="ib" id="fsp" style="font-weight:800;font-size:16px">A+</button></div><button class="ib" id="rShare" aria-label="مشاركة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button><button class="ib" id="rSave" style="${isS?"color:var(--acc)":""}"><svg viewBox="0 0 24 24" fill="${isS?"currentColor":"none"}" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button></div>
  <div class="wrap" style="padding-bottom:calc(40px + var(--sb))">
   ${a.img?`<div class="ph rimg"><img src="${esc(a.img)}" referrerpolicy="no-referrer" alt="" onerror="this.parentNode.remove()"></div>`:""}
   <div class="rmeta"><i class="sl" style="--c:${sc}">${esc(ini(sn))}</i><div><small>المصدر</small><b>${esc(sn)}</b></div><span style="margin-inline-start:auto;color:var(--mute);font-size:12.5px">${ago(a.ts)}</span></div>
   <h1 class="rh">${esc(a.t)}</h1>
   <div class="body" id="rbody">${a.d?`<p>${esc(a.d)}</p>`:""}<div class="loading"><span class="spn"></span>جاري تحميل الخبر…</div></div>
   <div class="endnote">نقلًا عن: <b style="color:var(--ink)">${esc(sn)}</b></div>
   ${rel.length?`<section class="box" style="box-shadow:none;border:1px solid var(--line)"><div class="bh"><h2>أخبار ذات صلة</h2></div>${rel.map(row).join("")}</section>`:""}
  </div>`;
  const R=$("#reader");R.scrollTop=0;R.classList.add("open");document.body.style.overflow="hidden";
  if(!noPush)history.pushState({r:1},"");
  const body=await getBody(a); if(openId!==id)return; const rb=$("#rbody"); if(!rb)return;
  if(body){const t=document.createElement("div");t.innerHTML=body;const fi=t.querySelector("img");if(fi&&a.img&&fi.getAttribute("src").split("?")[0].split("/").pop()===a.img.split("?")[0].split("/").pop())fi.remove();const h=t.querySelector("h3");if(h&&h.textContent.trim()===a.t.trim())h.remove();t.querySelectorAll("img").forEach(i=>{i.loading="lazy";i.referrerPolicy="no-referrer";i.onerror=()=>i.remove()});rb.innerHTML="";rb.append(...t.childNodes)}
  else rb.innerHTML=`${a.d?`<p>${esc(a.d)}</p>`:""}<div class="loading">تعذّر تحميل نص الخبر الآن. <button class="chip" data-retry="${a.id}">إعادة المحاولة</button></div>`;
}
function closeReader(fromPop){$("#reader").classList.remove("open");document.body.style.overflow="";openId=null;if(!fromPop&&history.state&&history.state.r)history.back();if(pending)applyUpdate(false)}
addEventListener("popstate",()=>{if(openId)closeReader(true)});

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const card=e.target.closest("[data-id]"); const t=e.target.closest("button");
  if(card&&!t) return openReader(card.dataset.id,!!openId);
  if(!t) return;
  if(t.id==="pill"){render();scrollTo({top:0,behavior:"smooth"});return}
  if(t.id==="rClose") return closeReader();
  if(t.id==="fsp"||t.id==="fsm"){fs=Math.max(14,Math.min(26,fs+(t.id==="fsp"?1:-1)));document.documentElement.style.setProperty("--fs",fs+"px");S.set("fs",fs);return}
  if(t.id==="rSave"){const a=findA(openId),i=saved.findIndex(s=>s.id===openId);if(i>=0){saved.splice(i,1);toast("اتشال من المحفوظات")}else{saved.unshift(a);toast("اتحفظ ✓")}S.set("saved",saved.slice(0,150));t.style.color=i>=0?"":"var(--acc)";t.querySelector("svg").setAttribute("fill",i>=0?"none":"currentColor");return}
  if(t.id==="rShare"){const a=findA(openId);if(navigator.share)navigator.share({title:a.t,text:a.t+"\n"+a.l}).catch(()=>{});return}
  if(t.dataset.retry) return openReader(t.dataset.retry,true);
  if(t.dataset.more){appendList(t.dataset.more);return}
  if(t.dataset.ctab){const k=t.dataset.ctab;if(k==="home"||k==="world")return go(k);if(k==="fb"){F.fbSeg="news";return go("fb")}return go("cat",{c:k})}
  if(t.dataset.stab){F.src[t.dataset.stab]=t.dataset.v;render();return}
  if(t.dataset.cseg){F.cseg=t.dataset.cseg;render();return}
  if(t.dataset.nav) return go(t.dataset.nav);
  if(t.dataset.country){F.cseg="news";return go("country",{c:t.dataset.country})}
  if(t.dataset.srcv) return go("source",{s:t.dataset.srcv});
  if(t.dataset.go){const[v,k]=t.dataset.go.split(":");if(v==="cat")return go("cat",{c:k});if(v==="fb"){F.fbSeg=k==="matches"?"matches":"news";return go("fb")}if(k)F[v]=k;return go(v)}
  if(t.dataset.f){F[t.dataset.f]=t.dataset.v;const y=scrollY;render();scrollTo(0,Math.min(y,200));return}
  if(t.dataset.fbseg){F.fbSeg=t.dataset.fbseg;render();if(F.fbSeg==="matches")startMatches();else clearInterval(mTimer);return}
  if(t.dataset.day){F.day=+t.dataset.day;render();loadMatches(true);return}
  if(t.id==="bSearch") return go("search");
  if(t.id==="bSaved") return go("saved");
  if(t.id==="bRefresh"){loadNews(true);loadMatches(route.v==="fb"&&F.fbSeg==="matches");return}
  if(t.id==="bTheme"){S.set("dark",document.documentElement.classList.toggle("dark"));return}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){loadNews(false);loadMatches(false)}});

/* ============ BOOT ============ */
tick(); setInterval(tick,1000); render(); setSub(); setInterval(setSub,60000);
loadNews(false); loadMatches(false);
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
